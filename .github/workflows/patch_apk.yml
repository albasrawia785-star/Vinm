name: Patch APK Ultimate Compatibility

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'رابط مباشر لـ APK'
        required: true
      target_sdk:
        description: 'Target SDK (35 for Android 15)'
        required: true
        default: '35'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner python3
          curl -L -o apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar"

      - name: Decompile APK
        run: |
          curl -L -o input.apk "${{ github.event.inputs.apk_url }}"
          java -jar apktool.jar d input.apk -o decompiled -f

      - name: Advanced Patching
        run: |
          TARGET_SDK="${{ github.event.inputs.target_sdk }}"
          
          # 1. تحديث SDK في apktool.yml
          sed -i "s/targetSdkVersion:.*/targetSdkVersion: '$TARGET_SDK'/g" decompiled/apktool.yml
          sed -i "s/minSdkVersion:.*/minSdkVersion: '21'/g" decompiled/apktool.yml
          
          # 2. حقن التوافق في AndroidManifest.xml (استخدام Python للتعامل مع الـ XML)
          python3 -c "
          import xml.etree.ElementTree as ET
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse('decompiled/AndroidManifest.xml')
          root = tree.getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          
          # إضافة Request Legacy Storage (مهم جداً لأندرويد 11+)
          if root.get(f'{ns}requestLegacyExternalStorage') is None:
              root.set(f'{ns}requestLegacyExternalStorage', 'true')
          if root.get(f'{ns}preserveLegacyExternalStorage') is None:
              root.set(f'{ns}preserveLegacyExternalStorage', 'true')
          
          # تصحيح الشاشات الحديثة و android:exported
          for elem in root.findall('.//activity') + root.findall('.//service') + root.findall('.//receiver'):
              if elem.find('intent-filter') is not None:
                  if f'{ns}exported' not in elem.attrib:
                      elem.set(f'{ns}exported', 'true')
          
          # إضافة دعم الشاشات الحديثة (Max Aspect Ratio)
          app = root.find('application')
          if app is not None:
              meta = ET.SubElement(app, 'meta-data')
              meta.set(f'{ns}name', 'android.max_aspect')
              meta.set(f'{ns}value', '2.5')
                      
          tree.write('decompiled/AndroidManifest.xml', encoding='utf-8', xml_declaration=True)
          "

      - name: Rebuild and Sign
        run: |
          java -jar apktool.jar b decompiled -o unsigned.apk
          zipalign -v -p 4 unsigned.apk aligned.apk
          keytool -genkey -v -keystore test.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android,O=Android,C=US'
          apksigner sign --ks test.keystore --ks-pass pass:android --key-pass pass:android --out patched_final.apk aligned.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Modernized-App
          path: patched_final.apk
