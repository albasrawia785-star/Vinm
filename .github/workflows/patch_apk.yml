name: Ultimate APK Nuclear Patch

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct Download URL for APK'
        required: true

jobs:
  patch-everything:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner python3 patchelf
          curl -L -o apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar"

      - name: Decompile
        run: |
          curl -L -o input.apk "${{ github.event.inputs.apk_url }}"
          java -jar apktool.jar d input.apk -o decompiled -f

      - name: Nuclear De-restriction Script
        run: |
          # 1. تدمير وسوم القيود في الملفات النصية
          sed -i '/maxSdkVersion/d' decompiled/apktool.yml
          sed -i 's/minSdkVersion:.*/minSdkVersion: 21/g' decompiled/apktool.yml
          sed -i 's/targetSdkVersion:.*/targetSdkVersion: 34/g' decompiled/apktool.yml
          
          # 2. مطابقة المعمارية لـ arm64-v8a
          mkdir -p decompiled/lib/arm64-v8a
          cp -r decompiled/lib/armeabi-v7a/* decompiled/lib/arm64-v8a/ 2>/dev/null || true
          
          # 3. تطهير الملفات الثنائية (الخطوة الأهم للـ Crash)
          find decompiled/lib/ -type f -name "*.so" -exec patchelf --clear-execstack {} + 2>/dev/null || true

          # 4. التدمير الشامل لكل القيود في المانيفست (Python Engine)
          python3 -c "
          import xml.etree.ElementTree as ET
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse('decompiled/AndroidManifest.xml')
          root = tree.getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          
          # قائمة الأعداء (القيود)
          forbidden_tags = ['compatible-screens', 'supports-gl-texture', 'uses-feature', 'uses-configuration', 'supports-screens']
          for tag in forbidden_tags:
              for elem in root.findall(tag):
                  root.remove(elem)
          
          # حقن بيئة العمل الشاملة
          app = root.find('application')
          app.set(f'{ns}extractNativeLibs', 'true')
          app.set(f'{ns}multiArch', 'true')
          app.set(f'{ns}largeHeap', 'true')
          app.set(f'{ns}requestLegacyExternalStorage', 'true')
          
          # حقن الصلاحيات
          for perm in ['android.permission.READ_EXTERNAL_STORAGE', 'android.permission.WRITE_EXTERNAL_STORAGE', 'android.permission.MANAGE_EXTERNAL_STORAGE']:
              ET.SubElement(root, 'uses-permission').set(f'{ns}name', perm)
          
          # فتح جميع الأنشطة
          for elem in root.findall('.//activity') + root.findall('.//service') + root.findall('.//receiver'):
              elem.set(f'{ns}exported', 'true')
          
          tree.write('decompiled/AndroidManifest.xml', encoding='utf-8', xml_declaration=True)
          "

      - name: Rebuild and Sign
        run: |
          java -jar apktool.jar b decompiled -o unsigned.apk
          zipalign -v -p 4 unsigned.apk aligned.apk
          keytool -genkeypair -v -keystore release.keystore -storepass 123456 -keypass 123456 -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android,O=Android,C=US'
          apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out patched_final.apk aligned.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NUCLEAR_PATCHED_APP
          path: patched_final.apk
